name: Pure Custom Signer

on:
  repository_dispatch:
    types: [trigger-sign]

jobs:
  build_and_sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Signing Environment
        run: |
          echo "::add-mask::${{ github.event.client_payload.password }}"
          cat << 'EOF' > /tmp/custom_openssl.cnf
          openssl_conf = openssl_init
          [openssl_init]
          providers = provider_sect
          [provider_sect]
          default = default_sect
          legacy = legacy_sect
          [default_sect]
          activate = 1
          [legacy_sect]
          activate = 1
          EOF
          wget -qO- https://github.com/zhlynn/zsign/releases/download/v1.0.4/zsign-linux-x86_64.tar.gz | tar -xz
          chmod +x zsign

      - name: Download, Sign and Upload Custom IPA
        env:
          IPA_URL: ${{ github.event.client_payload.ipa_url }}
          P12_URL: ${{ github.event.client_payload.p12_url }}
          PROV_URL: ${{ github.event.client_payload.prov_url }}
          PASS: ${{ github.event.client_payload.password }}
          GH_TOKEN: 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
        run: |
          export OPENSSL_CONF=/tmp/custom_openssl.cnf
          
          curl -L -s -o raw_app.ipa "$IPA_URL"
          curl -L -s -o cert.p12 "$P12_URL"
          curl -L -s -o profile.mobileprovision "$PROV_URL"
          
          if [ ! -s raw_app.ipa ] || [ ! -s cert.p12 ] || [ ! -s profile.mobileprovision ]; then
            echo "Error: Failed to download one or more files."
            exit 1
          fi
          
          unzip -q raw_app.ipa
          APP_DIR=$(find Payload -maxdepth 1 -type d -name "*.app" | head -n 1)
          
          rm -rf "$APP_DIR/PlugIns" "$APP_DIR/Extensions" "$APP_DIR/Watch" || true
          
          NEW_BUNDLE_ID="com.custom.vip.$(date +%s)"
          
          python3 -c '
          import plistlib, sys
          try:
              with open(sys.argv[1], "rb") as f: pl = plistlib.load(f)
              pl["CFBundleIdentifier"] = sys.argv[2]
              with open(sys.argv[1], "wb") as f: plistlib.dump(pl, f)
          except Exception as e:
              print(e)
          ' "$APP_DIR/Info.plist" "$NEW_BUNDLE_ID"
          
          rm raw_app.ipa
          zip -q0ur raw_app.ipa Payload
          
          ./zsign -k cert.p12 -p "$PASS" -m profile.mobileprovision -b "$NEW_BUNDLE_ID" -o CustomApp_signed.ipa raw_app.ipa
          
          FILE_NAME="CustomApp_$(date +%s)_signed.ipa"
          cp CustomApp_signed.ipa "$FILE_NAME"
          
          gh release upload V1 "$FILE_NAME" --clobber --repo ${{ github.repository }}
          
          cat <<EOF > CustomApp_manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>https://github.com/${{ github.repository }}/releases/download/V1/$FILE_NAME</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>$NEW_BUNDLE_ID</string>
                          <key>bundle-version</key>
                          <string>1.0</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>Custom Signed App</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF
          
          mkdir -p manifests
          mv CustomApp_manifest.plist manifests/CustomApp_manifest.plist
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/CustomApp_manifest.plist
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-Update Custom Manifest"
            git pull --rebase origin main
            git push
          fi

          # ناردنی فەرمان بۆ سڕینەوەی فایلەکە پاش ٢٠ خولەک
          curl -X POST https://api.github.com/repos/${{ github.repository }}/dispatches \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -d '{"event_type": "delete-asset", "client_payload": {"file_name": "'$FILE_NAME'"}}'
